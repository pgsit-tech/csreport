<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nextcloud连接测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .result { margin-top: 20px; padding: 15px; border-radius: 4px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .info { background: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Nextcloud连接测试工具</h1>
        
        <div class="form-group">
            <label for="serverUrl">服务器地址:</label>
            <input type="text" id="serverUrl" value="https://library.pgs-log.com/remote.php/dav/files/sales" placeholder="https://your-nextcloud.com/remote.php/dav/files/username">
        </div>
        
        <div class="form-group">
            <label for="username">用户名:</label>
            <input type="text" id="username" value="sales">
        </div>
        
        <div class="form-group">
            <label for="password">密码:</label>
            <input type="password" id="password" placeholder="输入密码">
        </div>
        
        <div class="form-group">
            <label for="targetPath">目标路径:</label>
            <input type="text" id="targetPath" value="/Sales Report">
        </div>
        
        <button onclick="testConnection()" id="testBtn">测试连接</button>
        <button onclick="testUpload()" id="uploadBtn">测试上传</button>
        
        <div id="result"></div>
    </div>

    <script>
        const API_BASE = 'https://csreport-api.20990909.xyz';
        
        function showResult(message, type = 'info') {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `<div class="result ${type}">${message}</div>`;
        }
        
        async function testConnection() {
            const testBtn = document.getElementById('testBtn');
            testBtn.disabled = true;
            testBtn.textContent = '测试中...';
            
            try {
                const serverUrl = document.getElementById('serverUrl').value;
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const targetPath = document.getElementById('targetPath').value;
                
                if (!serverUrl || !username || !password) {
                    showResult('请填写完整的连接信息', 'error');
                    return;
                }
                
                const params = new URLSearchParams({
                    serverUrl,
                    username,
                    password,
                    targetPath
                });
                
                showResult('正在测试连接...', 'info');
                
                const response = await fetch(`${API_BASE}/api/test-nextcloud?${params}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showResult(`
                        <h3>✅ 连接成功！</h3>
                        <p><strong>状态:</strong> ${result.status} ${result.statusText}</p>
                        <p><strong>配置类型:</strong> ${result.analysis?.detectedType || '未知'}</p>
                        <p><strong>建议:</strong> ${result.analysis?.recommendation || '无'}</p>
                        <p><strong>测试URL:</strong> ${result.config.testUrl}</p>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                    `, 'success');
                } else {
                    showResult(`
                        <h3>❌ 连接失败</h3>
                        <p><strong>错误:</strong> ${result.message}</p>
                        <p><strong>状态:</strong> ${result.status} ${result.statusText}</p>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                    `, 'error');
                }
                
            } catch (error) {
                showResult(`
                    <h3>❌ 测试失败</h3>
                    <p><strong>错误:</strong> ${error.message}</p>
                `, 'error');
            } finally {
                testBtn.disabled = false;
                testBtn.textContent = '测试连接';
            }
        }
        
        async function testUpload() {
            const uploadBtn = document.getElementById('uploadBtn');
            uploadBtn.disabled = true;
            uploadBtn.textContent = '上传测试中...';
            
            try {
                const config = {
                    serverUrl: document.getElementById('serverUrl').value,
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value,
                    targetPath: document.getElementById('targetPath').value
                };
                
                if (!config.serverUrl || !config.username || !config.password) {
                    showResult('请填写完整的连接信息', 'error');
                    return;
                }
                
                // 创建一个简单的测试内容（使用文本转Base64）
                const testContent = "This is a test file for Nextcloud upload.\nGenerated at: " + new Date().toISOString();
                const testPdfBase64 = btoa(testContent);
                
                showResult('正在测试上传...', 'info');
                
                const response = await fetch(`${API_BASE}/api/nextcloud/upload`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        config,
                        fileName: 'test-upload.txt',
                        fileContent: testPdfBase64,
                        formData: {
                            companyName: '测试公司',
                            contactPerson: '测试联系人',
                            queryCode: 'TEST001'
                        }
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showResult(`
                        <h3>✅ 上传成功！</h3>
                        <p><strong>文件名:</strong> ${result.data.fileName}</p>
                        <p><strong>上传路径:</strong> ${result.data.uploadPath}</p>
                        <p><strong>上传时间:</strong> ${result.data.uploadTime}</p>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                    `, 'success');
                } else {
                    showResult(`
                        <h3>❌ 上传失败</h3>
                        <p><strong>错误:</strong> ${result.message}</p>
                        <p><strong>调试信息:</strong> ${result.debug ? JSON.stringify(result.debug) : '无'}</p>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                    `, 'error');
                }
                
            } catch (error) {
                showResult(`
                    <h3>❌ 上传测试失败</h3>
                    <p><strong>错误:</strong> ${error.message}</p>
                `, 'error');
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.textContent = '测试上传';
            }
        }
    </script>
</body>
</html>
